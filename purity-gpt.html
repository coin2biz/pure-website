<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Purity GPT - Share</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:system-ui;background:#0f0f12;color:#fff;display:flex;flex-direction:column;height:100vh}
header{padding:12px 16px;background:#1a1a20;border-bottom:1px solid #333;display:flex;align-items:center;gap:10px;flex-wrap:wrap}

#shareBtn{padding:8px 14px;border-radius:20px;border:1px solid #444;background:#111;color:#fff;font-weight:bold}
#mode{display:flex;gap:8px;padding:10px;background:#1a1a20;border-bottom:1px solid #333}
.modeBtn{flex:1;padding:10px;border-radius:20px;border:1px solid #444;background:#111;color:#fff;font-weight:bold}
.modeBtn.active{background:#7c3aed;border-color:#7c3aed}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}

.user{background:#7c3aed;align-self:flex-end;border-bottom-right-radius:4px}
.ai{background:#1f1f26;align-self:flex-start;border-bottom-left-radius:4px;border:1px solid #333}
.msg img{width:100%;border-radius:12px;display:block;margin-top:8px}
.smallBtns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.smallBtns button{padding:5px 10px;border-radius:20px;border:1px solid #444;background:#111;color:#fff;font-size:12px}
#box{display:flex;gap:8px;padding:12px;background:#1a1a20;border-top:1px solid #333;align-items:center}
input{flex:1;padding:12px;border-radius:20px;border:1px solid #444;background:#111;color:#fff;outline:none}
button.send{padding:12px 18px;border:none;border-radius:20px;background:#7c3aed;color:#fff;font-weight:bold}
#uploadBtn{padding:12px 14px;border-radius:50%;border:1px solid #444;background:#111;color:#fff;font-size:18px}
#fileName{font-size:12px;color:#9be7a8;padding:0 12px 6px;background:#1a1a20;display:none}
#sharePopup{position:fixed;left:0;right:0;bottom:0;background:#1a1a20;border-top:1px solid #444;padding:16px;display:none;z-index:99;border-radius:20px 20px 0 0}
#sharePopup h3{margin:0 0 12px}
.shareRow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.shareRow button{padding:12px;border-radius:12px;border:1px solid #444;background:#222;color:#fff;font-weight:bold;font-size:14px}
.closeBtn{width:100%;margin-top:10px;padding:10px;background:#333;color:#fff;border:none;border-radius:12px}
</style>
</head>
<body>
<header><div style="font-size:24px">✨</div><div><b>Purity GPT</b><br><span>● Online - Chat + Image + Files</span></div>
<button id="shareBtn" onclick="openShare('Purity GPT - Ennoda AI App! Try pannunga: '+location.href)">↗ Share</button>
<select id="lang" style="margin-left:auto">
<option value="Auto">🌍 Auto</option>
<option value="Tamil">Tamil - தமிழ்</option>
<option value="Tanglish">Tanglish</option>
<option value="English">English</option>
<option value="Hindi">Hindi</option>
<option value="Telugu">Telugu</option>
<option value="Malayalam">Malayalam</option>
<option value="Kannada">Kannada</option>
<option value="Bengali">Bengali</option>
<option value="Marathi">Marathi</option>
</select>
</header>
<div id="mode">
<button class="modeBtn active" id="btnChat" onclick="setMode('chat')">💬 Chat</button>
<button class="modeBtn" id="btnImg" onclick="setMode('image')">🎨 Image</button>
</div>
<div id="chat"><div class="msg ai">Hello! Vanakkam! 🙏 I am Purity GPT. Ippo Share la 5 option irukku: WhatsApp, Telegram, PDF, Excel, Mail!</div></div>
<div id="fileName"></div>
<div id="box">
<button id="uploadBtn" onclick="document.getElementById('fileInput').click()">+</button>
<input type="file" id="fileInput" style="display:none" accept="image/*,.pdf,.txt,.csv,.md,.doc,.docx" onchange="handleFile(this)">
<input id="inp" placeholder="Type here..." /><button class="send" onclick="send()">Send</button>
</div>

<div id="sharePopup">
<h3>Share Pannunga Sir 👇</h3>
<div class="shareRow">
<button onclick="doShare('whatsapp')">🟢 WhatsApp</button>
<button onclick="doShare('telegram')">🔵 Telegram</button>
<button onclick="doShare('pdf')">🔴 PDF</button>
<button onclick="doShare('excel')">🟢 XL / Excel</button>
<button onclick="doShare('mail')">📧 Mail</button>
<button onclick="doShare('copy')">📋 Copy</button>
</div>
<button class="closeBtn" onclick="closeShare()">Close</button>
</div>

<script>

const chat = document.getElementById('chat');
const inp = document.getElementById('inp');
let mode = 'chat';
let historyText = "";
let uploadedFileText = "";
let uploadedFileName = "";
let currentShareText = "";

function setMode(m){
  mode = m;
  document.getElementById('btnChat').className = 'modeBtn' + (m=='chat' ? ' active' : '');
  document.getElementById('btnImg').className = 'modeBtn' + (m=='image' ? ' active' : '');
  inp.placeholder = m=='chat' ? 'Type here...' : 'Ex: A cute cat...';
}
function openShare(text){
  currentShareText = text || "Purity GPT";
  document.getElementById('sharePopup').style.display = 'block';
}
function closeShare(){ document.getElementById('sharePopup').style.display = 'none'; }
function doShare(type){
  const t = currentShareText;
  const link = location.href;
  if(type=='whatsapp'){ window.open('https://wa.me/?text=' + encodeURIComponent(t + '\n' + link), '_blank'); }
  if(type=='telegram'){ window.open('https://t.me/share/url?url=' + encodeURIComponent(link) + '&text=' + encodeURIComponent(t), '_blank'); }
  if(type=='mail'){ window.location.href = 'mailto:?subject=' + encodeURIComponent('Purity GPT Chat') + '&body=' + encodeURIComponent(t + '\n\n' + link); }
  if(type=='copy'){ navigator.clipboard.writeText(t + '\n' + link); alert('Copy aayiduchu Sir!'); }
  if(type=='pdf'){
    const w = window.open('', '_blank');
    w.document.write('<html><head><title>Purity GPT</title></head><body style="font-family:system-ui;padding:20px"><h2>Purity GPT - Chat</h2><pre style="white-space:pre-wrap;font-size:15px">' + t.replace(/</g,'&lt;') + '</pre><p>Link: ' + link + '</p></body></html>');
    w.document.close(); setTimeout(()=>{ w.print(); }, 500);
  }
  if(type=='excel'){
    const csv = "Purity GPT Chat\n\n" + '"' + t.replace(/"/g,'""') + '"\nLink,' + link;
    const blob = new Blob([csv], {type:'text/csv'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'purity-gpt-chat.csv'; a.click();
    alert('Excel / XL File Download aayiduchu Sir! CSV format la irukku, Excel la open pannalam.');
  }
  closeShare();
}
function addShareButtons(div, text){
  const wrap = document.createElement('div');
  wrap.className = 'smallBtns';
  const b1 = document.createElement('button');
  b1.textContent = '↗ Share';
  b1.onclick = ()=> openShare(text);
  const b2 = document.createElement('button');
  b2.textContent = '📋 Copy';
  b2.onclick = ()=>{ navigator.clipboard.writeText(text); alert('Copy aayiduchu Sir!'); };
  wrap.appendChild(b1); wrap.appendChild(b2);
  div.appendChild(wrap);
}
function addMsg(text, cls){
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  if(cls==='ai') addShareButtons(d, text);
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}
