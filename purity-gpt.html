<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Purity GPT</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:system-ui;background:#0f0f12;color:#fff;display:flex;flex-direction:column;height:100vh}
header{padding:14px 16px;background:#1a1a20;border-bottom:1px solid #333;display:flex;align-items:center;gap:10px}
header b{font-size:18px} header span{font-size:12px;color:#9be7a8;background:#1e3a24;padding:3px 8px;border-radius:20px}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:85%;padding:12px 14px;border-radius:16px;line-height:1.5;font-size:15px;white-space:pre-wrap}
.user{background:#7c3aed;align-self:flex-end;border-bottom-right-radius:4px}
.ai{background:#1f1f26;align-self:flex-start;border-bottom-left-radius:4px;border:1px solid #333}
#box{display:flex;gap:8px;padding:12px;background:#1a1a20;border-top:1px solid #333}
input{flex:1;padding:12px;border-radius:20px;border:1px solid #444;background:#111;color:#fff;outline:none}
button{padding:12px 18px;border:none;border-radius:20px;background:#7c3aed;color:#fff;font-weight:bold}
</style>
</head>
<body>
<header><div style="font-size:24px">✨</div><div><b>Purity GPT</b><br><span>● Online - No Key Needed</span></div></header>
<div id="chat"><div class="msg ai">Hello! I am Purity GPT. I am here to help you stay calm, focused and positive. What do you want to talk about?</div></div>
<div id="box"><input id="inp" placeholder="Type your message here..." /><button onclick="send()">Send</button></div>
<script>
const PROXY_URL = "https://script.google.com/macros/s/AKfycbwhHgSONkleX8P58kLPrwIXTpCwpxZtn-_dTTdc7sV21LNq9cr4gd2bDqEJwUPVNEil/exec";
const chat = document.getElementById('chat');
const inp = document.getElementById('inp');
let historyText = "";
function addMsg(text, cls){
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}
async function send(){
  const text = inp.value.trim();
  if(!text) return;
  addMsg(text, 'user');
  inp.value = '';
  const loading = addMsg('Thinking...', 'ai');
  historyText += "\nUser: " + text;
  try{
    const url = PROXY_URL + "?prompt=" + encodeURIComponent(historyText);
    const res = await fetch(url);
    const data = await res.json();
    const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Sorry, please try again. Error: " + (data.error?.message || JSON.stringify(data).slice(0,100));
    loading.textContent = reply;
    historyText += "\nAI: " + reply;
  }catch(e){
    loading.textContent = "Network problem, please try again.";
  }
  chat.scrollTop = chat.scrollHeight;
}
inp.addEventListener('keydown', e=>{ if(e.key==='Enter') send(); });
</script>
</body>
</html>
