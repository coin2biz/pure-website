<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Purity-GPT</title>
<style>
body{background:#111;color:#fff;font-family:Arial;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
.card{background:#222;padding:20px;border-radius:15px;width:90%;max-width:400px;text-align:center}
#chat{height:300px;overflow-y:auto;background:#000;padding:10px;border-radius:10px;text-align:left;margin:10px 0}
input{width:90%;padding:12px;border-radius:20px;border:none;margin-top:10px}
button{background:#00ff88;border:none;padding:12px 25px;border-radius:20px;margin-top:10px;font-weight:bold}
h1{color:#00ff88}
</style>
</head>
<body>
<div class="card">
<h1>Purity-GPT</h1>
<p>Ask about PURE Token</p>
<div id="chat">Hi Samy! Ask me anything about PURE.</div>
<input id="msg" placeholder="Type...">
<br>
<button onclick="send()">Send</button>
<br><br>
<a href="index.html" style="color:#aaa">← Back</a>
</div>

<script>
const API_KEY = "AQ.Ab8RN6IjND811-aOsH3jq8XJaEKQmHODz5nG6-MQLIBK9IQUsg";
async function send(){
  const input = document.getElementById("msg");
  const chat = document.getElementById("chat");
  const text = input.value;
  if(!text) return;
  chat.innerHTML += `<br><b style='color:#00ff88'>You:</b> ${text}<br>`;
  input.value = "";
  chat.innerHTML += `<br><i>Thinking...</i><br>`;
  chat.scrollTop = chat.scrollHeight;
  try{
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${API_KEY}`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({contents:[{parts:[{text:`You are Purity-GPT for PURE Token. Answer short. User: ${text}`}]}]})
    });
    const data = await res.json();
    console.log(data);
    if(data.error){ chat.innerHTML += `<br><b style='color:red'>Error: ${data.error.message}</b><br>`; return; }
    const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "No reply";
    chat.innerHTML = chat.innerHTML.replace("<br><i>Thinking...</i><br>","");
    chat.innerHTML += `<b>AI:</b> ${reply}<br>`;
  }catch(e){
    chat.innerHTML += `<br><b style='color:red'>Error: ${e.message}</b><br>`;
  }
  chat.scrollTop = chat.scrollHeight;
}
</script>
</body>
</html>
