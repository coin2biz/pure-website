<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PURE AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000}
body{font-family:system-ui,sans-serif;display:flex;overflow:hidden}
#sidebar{width:280px;background:#101010;border-right:1px solid #222;display:flex;flex-direction:column;transform:translateX(-100%);position:fixed;height:100%;z-index:10;transition:0.3s}
#sidebar.open{transform:translateX(0)}
#sidebar-top{padding:16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222}
#sidebar-top button{background:#222;color:#fff;border:none;padding:8px 14px;border-radius:20px;cursor:pointer}
#chats{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.chat-item{padding:12px 14px;background:#1a1a1a;border-radius:12px;color:#ccc;font-size:14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;position:relative}
.chat-item:hover{background:#222;color:#fff}
.chat-item.pinned{border-left:3px solid #fff}
.menu-btn{background:none;border:none;color:#888;font-size:18px;cursor:pointer;padding:0 4px}
.dropdown{position:absolute;right:10px;top:40px;background:#232323;border:1px solid #333;border-radius:12px;overflow:hidden;display:none;flex-direction:column;min-width:140px;z-index:20}
.dropdown button{background:none;border:none;color:#fff;padding:12px 16px;text-align:left;font-size:14px;cursor:pointer}
.dropdown button:hover{background:#333}
.main{flex:1;display:flex;flex-direction:column;background:#000;width:100%}
header{height:56px;background:#000;color:#fff;display:flex;align-items:center;gap:16px;padding:0 16px;font-weight:700;letter-spacing:3px;border-bottom:1px solid #222}
header #ham{font-size:22px;background:none;border:none;color:#fff;cursor:pointer}
#chat{flex:1;background:#000;padding:20px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.bubble{max-width:88%;padding:14px 18px;border-radius:22px;font-size:16px;line-height:1.4;white-space:pre-wrap}
.ai{background:#1e1e1e;color:#fff;align-self:flex-start;border-radius:22px 22px 22px 6px}
.user{background:#fff;color:#000;align-self:flex-end;border-radius:22px 22px 6px 22px}
.input-area{height:80px;background:#000;border-top:1px solid #222;display:flex;align-items:center;padding:0 16px;gap:12px}
.input-area input{flex:1;height:46px;background:#161616;border:1px solid #2a2a2a;border-radius:30px;padding:0 20px;color:#fff;outline:none;font-size:15px}
.input-area button{width:46px;height:46px;border-radius:50%;border:none;background:#fff;color:#000;font-size:20px;cursor:pointer}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:none;z-index:5}
.overlay.show{display:block}
</style>
</head>
<body>
<div id="sidebar">
  <div id="sidebar-top">
    <span style="color:#fff;font-weight:700">Chats</span>
    <button onclick="newChat()">+ New</button>
  </div>
  <div id="chats"></div>
</div>
<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<div class="main">
  <header>
    <button id="ham" onclick="toggleMenu()">☰</button>
    <span>PURE AI</span>
  </header>
  <div id="chat">
    <div class="bubble ai">Hello! I'm PURE AI, your intelligent assistant.<br><br>How can I help you today?</div>
  </div>
  <div class="input-area">
    <input id="inp" placeholder="Ask anything...">
    <button onclick="send()">➤</button>
  </div>
</div>

<script>
let chats = JSON.parse(localStorage.getItem('pure_chats')||'[]');
let currentId = localStorage.getItem('pure_cur')||null;

function toggleMenu(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
}
function save(){ localStorage.setItem('pure_chats', JSON.stringify(chats)); renderList(); }
function newChat(){
  let id=Date.now().toString();
  chats.unshift({id, title:'New Chat', pinned:false, messages:[{role:'ai',text:"Hello! I'm PURE AI, your intelligent assistant.\n\nHow can I help you today?"}]});
  currentId=id; localStorage.setItem('pure_cur',id);
  document.getElementById('chat').innerHTML=`<div class="bubble ai">Hello! I'm PURE AI, your intelligent assistant.<br><br>How can I help you today?</div>`;
  save(); toggleMenu();
}
function renderList(){
  let box=document.getElementById('chats'); box.innerHTML='';
  let sorted=[...chats].sort((a,b)=> (b.pinned - a.pinned));
  sorted.forEach(ch=>{
    let div=document.createElement('div'); div.className='chat-item'+(ch.pinned?' pinned':'');
    div.innerHTML=`<span onclick="loadChat('${ch.id}')" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${ch.title}</span>
    <button class="menu-btn" onclick="openDrop(event,'${ch.id}')">⋮</button>
    <div class="dropdown" id="drop-${ch.id}">
      <button onclick="shareChat('${ch.id}')">↗ Share</button>
      <button onclick="pinChat('${ch.id}')">${ch.pinned?'📌 Unpin':'📌 Pin'}</button>
      <button onclick="renameChat('${ch.id}')">✏️ Rename</button>
      <button onclick="deleteChat('${ch.id}')" style="color:#ff5555">🗑 Delete</button>
    </div>`;
    box.appendChild(div);
  });
}
function openDrop(e,id){
  e.stopPropagation();
  document.querySelectorAll('.dropdown').forEach(d=>d.style.display='none');
  let d=document.getElementById('drop-'+id); d.style.display=d.style.display==='flex'?'none':'flex';
}
function loadChat(id){
  let ch=chats.find(c=>c.id===id); if(!ch) return;
  currentId=id; localStorage.setItem('pure_cur',id);
  let cbox=document.getElementById('chat'); cbox.innerHTML='';
  ch.messages.forEach(m=>{ cbox.innerHTML+=`<div class="bubble ${m.role==='user'?'user':'ai'}">${m.text}</div>`; });
  cbox.scrollTop=cbox.scrollHeight; toggleMenu();
}
function getCurrent(){ return chats.find(c=>c.id===currentId); }

async function send(){
 let v=document.getElementById('inp').value.trim(); if(!v) return;
 if(!currentId) { newChat(); }
 let cur=getCurrent();
 let c=document.getElementById('chat');
 c.innerHTML+=`<div class="bubble user">${v}</div>`;
 cur.messages.push({role:'user',text:v});
 if(cur.messages.length===2) cur.title=v.slice(0,30);
 document.getElementById('inp').value='';
 let d=document.createElement('div'); d.className='bubble ai'; d.textContent='...'; c.appendChild(d);
 c.scrollTop=c.scrollHeight;
 try{ let r=await fetch(`https://text.pollinations.ai/${encodeURIComponent(v)}`); let txt=await r.text(); d.textContent=txt; cur.messages.push({role:'ai',text:txt}); }catch(e){d.textContent='Error';}
 save(); c.scrollTop=c.scrollHeight;
}
function shareChat(id){ let ch=chats.find(c=>c.id===id); if(!ch) return; let txt=ch.messages.map(m=>m.role+': '+m.text).join('\n\n'); navigator.clipboard.writeText(txt); alert('Chat copied! Share panna ready da!'); }
function pinChat(id){ let ch=chats.find(c=>c.id===id); ch.pinned=!ch.pinned; save(); }
function renameChat(id){ let ch=chats.find(c=>c.id===id); let n=prompt('New name:',ch.title); if(n){ ch.title=n; save(); } }
function deleteChat(id){ if(!confirm('Delete this chat?')) return; chats=chats.filter(c=>c.id!==id); if(currentId===id){ currentId=null; document.getElementById('chat').innerHTML=`<div class="bubble ai">Hello! I'm PURE AI, your intelligent assistant.<br><br>How can I help you today?</div>`;} save(); }

document.getElementById('inp').addEventListener('keydown',e=>{if(e.key==='Enter')send()});
document.addEventListener('click',()=>{document.querySelectorAll('.dropdown').forEach(d=>d.style.display='none')});
renderList();
if(currentId) loadChat(currentId);
</script>
</body>
</html>
