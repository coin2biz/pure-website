<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Purity-GPT - Pure AI Token</title>
<style>
body{background:#0a0a0a;color:white;font-family:sans-serif;text-align:center;padding:20px}
.box{max-width:700px;margin:20px auto;background:#1a1a1a;padding:25px;border-radius:15px}
h1{color:#00ff88}
#chat{height:300px;overflow-y:auto;background:#000;padding:15px;border-radius:10px;text-align:left;margin:15px 0}
input{width:70%;padding:12px;border-radius:10px;border:none}
button{background:#00ff88;color:black;border:none;padding:12px 20px;border-radius:10px;margin-left:5px}
.msg{margin:10px 0}
.user{color:#00ff88}
.ai{color:white}
</style>
</head>
<body>
<div class="box">
<h1>Purity-GPT</h1>
<p>Ask about PURE Token</p>
<div id="chat"><div class="msg ai">Hi Samy! Ask me anything about PURE.</div></div>
<input type="text" placeholder="Type..." id="q" onkeypress="if(event.key==='Enter')ask()">
<button onclick="ask()">Send</button>
<br><br>
<a href="/" style="color:#888">← Back</a>
</div>
<script>
const API_KEY = "PASTE_YOUR_GEMINI_API_KEY_HERE";

async function ask(){
 let input = document.getElementById('q');
 let question = input.value;
 if(!question) return;
 let chat = document.getElementById('chat');
 chat.innerHTML += `<div class="msg user"><b>You:</b> ${question}</div>`;
 input.value = '';
 
 try{
  let res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`,{
   method:'POST',
   headers:{'Content-Type':'application/json'},
   body:JSON.stringify({contents:[{parts:[{text:`You are Purity-GPT for PURE AI Token. Answer short: ${question}`}]}]})
  });
  let data = await res.json();
  let answer = data.candidates[0].content.parts[0].text;
  chat.innerHTML += `<div class="msg ai"><b>Purity-GPT:</b> ${answer}</div>`;
 } catch(e){
  chat.innerHTML += `<div class="msg ai" style="color:red">Error: Check API Key</div>`;
 }
 chat.scrollTop = chat.scrollHeight;
}
</script>
</body>
</html>
