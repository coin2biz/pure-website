<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PURE AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000}
body{font-family:system-ui,sans-serif;display:flex;flex-direction:column}
header{height:56px;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;letter-spacing:3px;border-bottom:1px solid #222}
#chat{flex:1;background:#000;padding:20px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.bubble{max-width:88%;padding:14px 18px;border-radius:22px;font-size:16px;line-height:1.4}
.ai{background:#1e1e1e;color:#fff;align-self:flex-start;border-radius:22px 22px 22px 6px}
.user{background:#fff;color:#000;align-self:flex-end;border-radius:22px 22px 6px 22px}
.input-area{height:80px;background:#000;border-top:1px solid #222;display:flex;align-items:center;padding:0 16px;gap:12px}
.input-area input{flex:1;height:46px;background:#161616;border:1px solid #2a2a2a;border-radius:30px;padding:0 20px;color:#fff;outline:none;font-size:15px}
.input-area button{width:46px;height:46px;border-radius:50%;border:none;background:#fff;color:#000;font-size:20px}
</style>
</head>
<body>
<header>PURE AI</header>
<div id="chat">
<div class="bubble ai">Hello! I'm PURE AI, your intelligent assistant.<br><br>How can I help you today?</div>
</div>
<div class="input-area">
<input id="inp" placeholder="Ask anything...">
<button onclick="send()">➤</button>
</div>
<script>
async function send(){
 let v=document.getElementById('inp').value.trim(); if(!v) return;
 let c=document.getElementById('chat');
 c.innerHTML+=`<div class="bubble user">${v}</div>`;
 document.getElementById('inp').value='';
 let d=document.createElement('div'); d.className='bubble ai'; d.textContent='...'; c.appendChild(d);
 c.scrollTop=c.scrollHeight;
 try{ let r=await fetch(`https://text.pollinations.ai/${encodeURIComponent(v)}`); d.textContent=await r.text(); }catch(e){d.textContent='Error';}
 c.scrollTop=c.scrollHeight;
}
document.getElementById('inp').addEventListener('keydown',e=>{if(e.key==='Enter')send()});
</script>
</body>
</html>
