<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Purity GPT - All Languages</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:system-ui;background:#0f0f12;color:#fff;display:flex;flex-direction:column;height:100vh}
header{padding:12px 16px;background:#1a1a20;border-bottom:1px solid #333;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header b{font-size:18px} header span{font-size:12px;color:#9be7a8;background:#1e3a24;padding:3px 8px;border-radius:20px}
select{margin-left:auto;padding:8px 10px;border-radius:20px;border:1px solid #444;background:#111;color:#fff;outline:none;font-size:14px}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:85%;padding:12px 14px;border-radius:16px;line-height:1.6;font-size:15px;white-space:pre-wrap}
.user{background:#7c3aed;align-self:flex-end;border-bottom-right-radius:4px}
.ai{background:#1f1f26;align-self:flex-start;border-bottom-left-radius:4px;border:1px solid #333}
#box{display:flex;gap:8px;padding:12px;background:#1a1a20;border-top:1px solid #333}
input{flex:1;padding:12px;border-radius:20px;border:1px solid #444;background:#111;color:#fff;outline:none}
button{padding:12px 18px;border:none;border-radius:20px;background:#7c3aed;color:#fff;font-weight:bold}
</style>
</head>
<body>
<header><div style="font-size:24px">✨</div><div><b>Purity GPT</b><br><span>● Online - All Languages 🌍</span></div>
<select id="lang">
<option value="Auto">🌍 Auto - Detect My Language</option>
<option value="Tamil">🇮🇳 Tamil - தமிழ்</option>
<option value="Tanglish">🇮🇳 Tanglish</option>
<option value="English">🇺🇸 English</option>
<option value="Hindi">🇮🇳 Hindi - हिन्दी</option>
<option value="Telugu">🇮🇳 Telugu - తెలుగు</option>
<option value="Malayalam">🇮🇳 Malayalam - മലയാളം</option>
<option value="Kannada">🇮🇳 Kannada - ಕನ್ನಡ</option>
<option value="Bengali">🇮🇳 Bengali - বাংলা</option>
<option value="Marathi">🇮🇳 Marathi - मराठी</option>
<option value="Spanish">🇪🇸 Spanish</option>
<option value="French">🇫🇷 French</option>
<option value="German">🇩🇪 German</option>
<option value="Arabic">🇸🇦 Arabic</option>
<option value="Chinese">🇨🇳 Chinese</option>
<option value="Japanese">🇯🇵 Japanese</option>
<option value="Korean">🇰🇷 Korean</option>
</select>
</header>
<div id="chat"><div class="msg ai">Hello! Vanakkam! Namaste! 🙏 I am Purity GPT. I can speak in ALL languages. Select your language above, or just type in your language!</div></div>
<div id="box"><input id="inp" placeholder="Type in any language..." /><button onclick="send()">Send</button></div>
<script>
const PROXY_URL = "https://script.google.com/macros/s/AKfycbwhHgSONkleX8P58kLPrwIXTpCwpxZtn-_dTTdc7sV21LNq9cr4gd2bDqEJwUPVNEil/exec";
const chat = document.getElementById('chat');
const inp = document.getElementById('inp');
let historyText = "";
function addMsg(text, cls){
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}
async function send(){
  const text = inp.value.trim();
  if(!text) return;
  addMsg(text, 'user');
  inp.value = '';
  const loading = addMsg('Thinking...', 'ai');
  const lang = document.getElementById('lang').value;
  let finalPrompt = text;
  if(lang !== "Auto"){
    finalPrompt = "Reply ONLY in " + lang + " language. User message: " + text;
  } else {
    finalPrompt = "Detect user language and reply in SAME language. User message: " + text;
  }
  historyText += "\nUser: " + finalPrompt;
  try{
    const url = PROXY_URL + "?prompt=" + encodeURIComponent(historyText);
    const res = await fetch(url);
    const data = await res.json();
    const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Sorry, please try again.";
    loading.textContent = reply;
    historyText += "\nAI: " + reply;
  }catch(e){
    loading.textContent = "Network problem, please try again.";
  }
  chat.scrollTop = chat.scrollHeight;
}
inp.addEventListener('keydown', e=>{ if(e.key==='Enter') send(); });
</script>
</body>
  </html>
