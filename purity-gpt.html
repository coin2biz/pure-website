<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Purity GPT - Chat + Image + Files + Share</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:system-ui;background:#0f0f12;color:#fff;display:flex;flex-direction:column;height:100vh}
header{padding:12px 16px;background:#1a1a20;border-bottom:1px solid #333;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header b{font-size:18px} header span{font-size:12px;color:#9be7a8;background:#1e3a24;padding:3px 8px;border-radius:20px}
select{padding:8px 10px;border-radius:20px;border:1px solid #444;background:#111;color:#fff;outline:none;font-size:14px}
#shareBtn{padding:8px 14px;border-radius:20px;border:1px solid #444;background:#111;color:#fff;font-weight:bold}
#mode{display:flex;gap:8px;padding:10px;background:#1a1a20;border-bottom:1px solid #333}
.modeBtn{flex:1;padding:10px;border-radius:20px;border:1px solid #444;background:#111;color:#fff;font-weight:bold}
.modeBtn.active{background:#7c3aed;border-color:#7c3aed}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:12px 14px;border-radius:16px;line-height:1.6;font-size:15px;white-space:pre-wrap;position:relative}
.user{background:#7c3aed;align-self:flex-end;border-bottom-right-radius:4px}
.ai{background:#1f1f26;align-self:flex-start;border-bottom-left-radius:4px;border:1px solid #333}
.msg img{width:100%;border-radius:12px;display:block;margin-top:8px}
.smallBtns{display:flex;gap:6px;margin-top:8px}
.smallBtns button{padding:5px 10px;border-radius:20px;border:1px solid #444;background:#111;color:#fff;font-size:12px}
#box{display:flex;gap:8px;padding:12px;background:#1a1a20;border-top:1px solid #333;align-items:center}
input{flex:1;padding:12px;border-radius:20px;border:1px solid #444;background:#111;color:#fff;outline:none}
button.send{padding:12px 18px;border:none;border-radius:20px;background:#7c3aed;color:#fff;font-weight:bold}
#uploadBtn{padding:12px 14px;border-radius:50%;border:1px solid #444;background:#111;color:#fff;font-size:18px}
#fileName{font-size:12px;color:#9be7a8;padding:0 12px 6px;background:#1a1a20;display:none}
</style>
</head>
<body>
<header><div style="font-size:24px">✨</div><div><b>Purity GPT</b><br><span>● Online - Chat + Image + Files</span></div>
<button id="shareBtn" onclick="shareApp()">↗ Share</button>
<select id="lang" style="margin-left:auto">
<option value="Auto">🌍 Auto</option>
<option value="Tamil">🇮🇳 Tamil - தமிழ்</option>
<option value="Tanglish">🇮🇳 Tanglish</option>
<option value="English">🇺🇸 English</option>
<option value="Hindi">🇮🇳 Hindi</option>
<option value="Telugu">🇮🇳 Telugu</option>
<option value="Malayalam">🇮🇳 Malayalam</option>
<option value="Kannada">🇮🇳 Kannada</option>
<option value="Bengali">🇮🇳 Bengali</option>
<option value="Marathi">🇮🇳 Marathi</option>
<option value="Spanish">🇪🇸 Spanish</option>
<option value="French">🇫🇷 French</option>
<option value="German">🇩🇪 German</option>
<option value="Arabic">🇸🇦 Arabic</option>
<option value="Chinese">🇨🇳 Chinese</option>
<option value="Japanese">🇯🇵 Japanese</option>
<option value="Korean">🇰🇷 Korean</option>
</select>
</header>
<div id="mode">
<button class="modeBtn active" id="btnChat" onclick="setMode('chat')">💬 Chat</button>
<button class="modeBtn" id="btnImg" onclick="setMode('image')">🎨 Image</button>
</div>
<div id="chat"><div class="msg ai">Hello! Vanakkam! 🙏 I am Purity GPT. Chat pannalam, Image create pannalam, File um anupalam. Ippo Share um pannalam! Mela Share button irukku!</div></div>
<div id="fileName"></div>
<div id="box">
<button id="uploadBtn" onclick="document.getElementById('fileInput').click()">+</button>
<input type="file" id="fileInput" style="display:none" accept="image/*,.pdf,.txt,.csv,.md,.doc,.docx" onchange="handleFile(this)">
<input id="inp" placeholder="Type here..." /><button class="send" onclick="send()">Send</button>
</div>
<script>
const PROXY_URL = "https://script.google.com/macros/s/AKfycbwhHgSONkleX8P58kLPrwIXTpCwpxZtn-_dTTdc7sV21LNq9cr4gd2bDqEJwUPVNEil/exec";
const chat = document.getElementById('chat');
const inp = document.getElementById('inp');
let mode = 'chat';
let historyText = "";
let uploadedFileText = "";
let uploadedFileName = "";
function setMode(m){
  mode = m;
  document.getElementById('btnChat').className = 'modeBtn' + (m=='chat' ? ' active' : '');
  document.getElementById('btnImg').className = 'modeBtn' + (m=='image' ? ' active' : '');
  inp.placeholder = m=='chat' ? 'Type here...' : 'Ex: A cute cat in Tamil Nadu...';
}
async function shareApp(){
  const text = "Purity GPT - Ennoda AI App! Chat, Image, File ellam pannalam. Try pannunga: " + window.location.href;
  if(navigator.share){ try{ await navigator.share({title:'Purity GPT', text:text, url:window.location.href}); }catch(e){} }
  else { navigator.clipboard.writeText(text); alert('Link Copy aayiduchu Sir! Ippo WhatsApp la paste pannunga.'); }
}
function addShareButtons(div, text){
  const wrap = document.createElement('div');
  wrap.className = 'smallBtns';
  const b1 = document.createElement('button');
  b1.textContent = '↗ Share';
  b1.onclick = async ()=>{
    if(navigator.share){ try{ await navigator.share({title:'Purity GPT', text:text}); }catch(e){} }
    else { navigator.clipboard.writeText(text); alert('Copy aayiduchu Sir!'); }
  };
  const b2 = document.createElement('button');
  b2.textContent = '📋 Copy';
  b2.onclick = ()=>{ navigator.clipboard.writeText(text); alert('Copy aayiduchu Sir!'); };
  wrap.appendChild(b1); wrap.appendChild(b2);
  div.appendChild(wrap);
}
function addMsg(text, cls){
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  if(cls==='ai') addShareButtons(d, text);
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}
function handleFile(input){
  const file = input.files[0];
  if(!file) return;
  uploadedFileName = file.name;
  const bar = document.getElementById('fileName');
  bar.style.display = 'block';
  bar.textContent = '📎 ' + file.name + ' - Import aayiduchu! Ippo question kekkalam.';
  if(file.type.startsWith('image/')){
    const reader = new FileReader();
    reader.onload = (e)=>{
      const div = document.createElement('div');
      div.className = 'msg user';
      div.textContent = '📷 Image: ' + file.name;
      const img = document.createElement('img');
      img.src = e.target.result;
      div.appendChild(img);
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      uploadedFileText = "[User uploaded an image named " + file.name + "]";
      addMsg('Image vandhuruchu Sir! 📷 Ippo adha pathi enna kekkanum nu type pannunga.', 'ai');
    };
    reader.readAsDataURL(file);
  } else {
    const reader = new FileReader();
    reader.onload = (e)=>{
      uploadedFileText = e.target.result.substring(0, 8000);
      const div = document.createElement('div');
      div.className = 'msg user';
      div.textContent = '📄 File: ' + file.name + '\n' + uploadedFileText.substring(0,500);
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      addMsg('File Import aayiduchu Sir! 📄 ' + file.name + ' - Ippo idha pathi enna kekkanum nu type pannunga.', 'ai');
    };
    reader.readAsText(file);
  }
  input.value = '';
}
async function send(){
  const text = inp.value.trim();
  if(!text && !uploadedFileText) return;
  if(text) addMsg(text, 'user');
  inp.value = '';
  document.getElementById('fileName').style.display = 'none';
  if(mode === 'image' && !uploadedFileText){
    const loading = addMsg('🎨 Image create pannitu irukken...', 'ai');
    const imgUrl = "https://image.pollinations.ai/prompt/" + encodeURIComponent(text + ", high quality, beautiful, detailed") + "?width=1024&height=1024&seed=" + Math.floor(Math.random()*100000) + "&nologo=true";
    const div = document.createElement('div');
    div.className = 'msg ai';
    div.textContent = 'Ippo unga image ready Sir! 🎨👇';
    const img = document.createElement('img');
    img.src = imgUrl;
    img.onload = ()=>{ loading.remove(); addShareButtons(div, 'Purity GPT la create panna image: ' + text + ' - ' + imgUrl); chat.appendChild(div); div.appendChild(img); chat.scrollTop = chat.scrollHeight; };
    img.onerror = ()=>{ loading.textContent = 'Image create mudiyala Sir, thirumba try pannunga.'; };
    return;
  }
  const loading = addMsg('Thinking...', 'ai');
  const lang = document.getElementById('lang').value;
  let finalPrompt = text;
  if(uploadedFileText){
    finalPrompt = "User uploaded file [" + uploadedFileName + "] content: " + uploadedFileText + "\n\nUser question: " + text;
    uploadedFileText = "";
  }
  if(lang !== "Auto"){ finalPrompt = "Reply ONLY in " + lang + " language. " + finalPrompt; }
  else { finalPrompt = "Detect user language and reply in SAME language. " + finalPrompt; }
  historyText += "\nUser: " + finalPrompt;
  try{
    const url = PROXY_URL + "?prompt=" + encodeURIComponent(historyText);
    const res = await fetch(url);
    const data = await res.json();
    const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Sorry, please try again.";
    loading.textContent = reply;
    addShareButtons(loading, reply);
    historyText += "\nAI: " + reply;
  }catch(e){ loading.textContent = "Network problem, please try again."; }
  chat.scrollTop = chat.scrollHeight;
}
inp.addEventListener('keydown', e=>{ if(e.key==='Enter') send(); });
</script>
</body>
                                 </html>
