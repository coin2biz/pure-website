<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PURE AI - Professional</title>
<style>
  /* Professional CSS - Clean & Fast */
  body{margin:0;background:#000;color:#fff;font-family:system-ui;height:100vh;display:flex;justify-content:center}
  .app{width:100%;max-width:480px;background:#0f0f0f;display:flex;flex-direction:column;height:100vh;border:1px solid #222}
  .header{padding:20px;border-bottom:1px solid #222;display:flex;align-items:center;gap:10px}
  .header h1{letter-spacing:6px;font-size:18px;margin:0}
  #chat{flex:1;padding:20px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
  .bubble{padding:14px 18px;border-radius:18px;max-width:85%;font-size:14px;line-height:1.5}
  .bubble.user{align-self:flex-end;background:#fff;color:#000;border-bottom-right-radius:4px}
  .bubble.ai{align-self:flex-start;background:#1e1e1e;border:1px solid #2a2a2a;border-bottom-left-radius:4px}
  .input-area{padding:16px;display:flex;gap:10px;border-top:1px solid #222}
  .input-area input{flex:1;background:#1e1e1e;border:1px solid #333;border-radius:24px;padding:12px 18px;color:#fff;outline:none}
  .input-area button{background:#fff;color:#000;border:none;border-radius:50%;width:44px;height:44px;cursor:pointer;font-weight:bold}
</style>
</head>
<body>
<div class="app">
  <div class="header"><h1>PURE AI</h1></div>
  <div id="chat"><div class="bubble ai">Hi Anna! I'm PURE AI. How can I help?</div></div>
  <div class="input-area"><input id="inp" placeholder="Ask anything..."><button onclick="send()">↑</button></div>
</div>
<script>
  // Professional JS - No error
  const chat=document.getElementById('chat');
  async function send(){
    const input=document.getElementById('inp');
    const text=input.value.trim(); if(!text) return;
    chat.innerHTML+=`<div class="bubble user">${text}</div>`;
    input.value=''; chat.scrollTop=chat.scrollHeight;
    const token=localStorage.getItem('pure_token') || prompt('Enter Gemini Token Anna:');
    if(token) localStorage.setItem('pure_token',token);
    try{
      const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${token}`,{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({contents:[{parts:[{text}]}]})
      });
      const data=await res.json();
      const reply=data.candidates?.[0]?.content?.parts?.[0]?.text || 'Error Anna';
      chat.innerHTML+=`<div class="bubble ai">${reply}</div>`;
      chat.scrollTop=chat.scrollHeight;
    }catch(e){chat.innerHTML+=`<div class="bubble ai">Token thappu Anna, check pannunga</div>`;}
  }
  document.getElementById('inp').addEventListener('keydown',e=>{if(e.key==='Enter')send()});
</script>
</body>
  </html>
